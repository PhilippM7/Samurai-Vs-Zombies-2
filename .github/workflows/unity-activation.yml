name: Unity Activation File
on: workflow_dispatch
jobs:
  activate-2019:
    runs-on: ubuntu-latest
    steps:
      - name: Test credential activation on 2019.4.40f1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD unityci/editor:ubuntu-2019.4.40f1-android-3.2.2 bash -c '
            unity-editor -batchmode -nographics -quit -logFile /dev/stdout \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || echo "editor exit: $?"
            echo "--- license files after activation attempt ---"
            ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || echo "no license dir"
            find / -name "Unity_lic.ulf" -not -path "/proc/*" 2>/dev/null || true'

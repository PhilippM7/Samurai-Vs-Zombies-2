name: Unity Activation File
on: workflow_dispatch
jobs:
  alf-2018:
    runs-on: ubuntu-latest
    steps:
      - name: Create ALF with Unity 2018.4.36f1
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" -w /out unityci/editor:ubuntu-2018.4.36f1-android-3.2.2 bash -c '
            unity-editor -batchmode -nographics -quit -logFile /dev/stdout -createManualActivationFile || true
            find / -name "*.alf" -not -path "/proc/*" -exec cp -v {} /out/ \; 2>/dev/null
            chmod 666 /out/*.alf 2>/dev/null; ls -la /out; true'
          ls -la out
      - name: Upload ALF 2018
        uses: actions/upload-artifact@v4
        with:
          name: alf-2018
          path: out/*.alf
          if-no-files-found: error
  alf-2019:
    runs-on: ubuntu-latest
    steps:
      - name: Create ALF with Unity 2019.4.40f1
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" -w /out unityci/editor:ubuntu-2019.4.40f1-android-3.2.2 bash -c '
            unity-editor -batchmode -nographics -quit -logFile /dev/stdout -createManualActivationFile || true
            find / -name "*.alf" -not -path "/proc/*" -exec cp -v {} /out/ \; 2>/dev/null
            chmod 666 /out/*.alf 2>/dev/null; ls -la /out; true'
          ls -la out
      - name: Upload ALF 2019
        uses: actions/upload-artifact@v4
        with:
          name: alf-2019
          path: out/*.alf
          if-no-files-found: error

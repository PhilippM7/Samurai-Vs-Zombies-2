name: Build Android ARM64
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: printf '%s' "$UNITY_LICENSE" > Unity_lic.ulf

      - name: Build ARM64 APK (Unity 2018.4.36f1, IL2CPP)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            unityci/editor:ubuntu-2018.4.36f1-android-3.2.2 bash -c '
            mkdir -p /root/.local/share/unity3d/Unity
            cp /project/Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
            unity-editor -batchmode -nographics -quit -logFile /dev/stdout \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
            unity-editor -batchmode -nographics -quit -logFile /dev/stdout \
              -projectPath /project -buildTarget Android -accept-apiupdate \
              -executeMethod CIBuild.BuildAndroid'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SvZ2-ARM64
          path: Build/*.apk
          if-no-files-found: error

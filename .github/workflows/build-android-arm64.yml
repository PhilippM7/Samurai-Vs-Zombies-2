name: Build Android ARM64
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android NDK r13b (required by Unity 2017.4 IL2CPP)
        run: |
          curl -sLo ndk.zip https://dl.google.com/android/repository/android-ndk-r13b-linux-x86_64.zip
          unzip -q ndk.zip -d "$PWD/ndk"

      - name: Write Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: printf '%s' "$UNITY_LICENSE" > Unity_lic.ulf

      - name: Build ARM64 APK
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e ANDROID_NDK_ROOT=/project/ndk/android-ndk-r13b \
            gableroux/unity3d:2017.4.27f1-android bash -c '
            xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
              /opt/Unity/Editor/Unity -batchmode -nographics -quit -logFile /dev/stdout \
              -manualLicenseFile /project/Unity_lic.ulf || true
            xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
              /opt/Unity/Editor/Unity -batchmode -nographics -quit -logFile /dev/stdout \
              -projectPath /project -buildTarget Android -executeMethod CIBuild.BuildAndroid'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SvZ2-ARM64
          path: Build/*.apk
          if-no-files-found: error
